<h1>ウィンドウ</h1>

<ul>
<img src="./../IMAGES/WINDOWS.PNG" border=0>
</ul>

<p>DVD-ROMカタログブラウザは、次に示す5種類のウィンドウで構成されています。</p>

<ul>
① <a href="./../1WINDOW/2CIRCLE.HTM">サークルカットウィンドウ</a><br>
② <a href="./../1WINDOW/6LIST.HTM">サークル一覧ウィンドウ</a><br>
③ <a href="./../1WINDOW/4DETAIL.HTM">サークル詳細ウィンドウ</a><br>
④ <a href="./../1WINDOW/5MAP.HTM">会場マップウィンドウ</a><br>
② <a href="./../1WINDOW/3CHECK.HTM">チェックリストウィンドウ</a><br>
</ul>

<p>「<a href="./../1WINDOW/2CIRCLE.HTM">サークルカットウィンドウ</a>」以外のウィンドウは、<a href="./../1WINDOW/7MENU.HTM">メインメニュー</a>の「<a href="../1WINDOW/7MENU.HTM#part7">ウィンドウ</a>」メニューから表示をON/OFFすることができます。</p>

<p><a href="./../1WINDOW/2CIRCLE.HTM">サークルカットウィンドウ</a>はメインウィンドウになるため、表示をOFFにすることはできません。</p>
