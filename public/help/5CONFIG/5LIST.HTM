<h1>リスト表示の設定</h1>

<ul>
<img src="./../IMAGES/CONFIG5.PNG" border=0>
</ul>

<p><a href="./../1WINDOW/3CHECK.HTM">チェックリストウィンドウ</a>、<a href="./../1WINDOW/6LIST.HTM">サークル一覧ウィンドウ</a>での、リスト表示の表示項目と項目の位置を設定できます。</p>
<p>それぞれの項目にチェックを入れると、その項目の列が表示されます。<br>逆にチェックを外すと、その項目は非表示になります。</p>
<p>また、項目を選択して「前へ移動」「後へ移動」ボタンを押すことで、項目の表示列を変更できます。<br>一番上にある項目がリストでは左側に、一番下にある項目がリストでは一番右側に表示されます。</p>
<p>なお、「サークル名」に関しては非表示にすることはできません。<br>また、表示順の設定に関係なく、一番左側の列には「チェック色」が常に表示されます。</p>

</BODY>
