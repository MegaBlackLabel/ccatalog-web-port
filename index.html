<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 98 風のウィンドウアイコン (外部ファイルを持たないよう data URI で埋め込む) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23c0c0c0' stroke='%23000'/%3E%3Crect x='1' y='1' width='14' height='3' fill='%23000080'/%3E%3Crect x='1' y='6' width='14' height='9' fill='%23fff'/%3E%3C/svg%3E"
    />
    <!-- カットのスペース番号に使うフォント。実物の数字は太字 (線幅が文字高の 20%) で、
         Roboto Bold が 16% と一番近い (実測: Roboto 400=8% / 500=14% / 700=16% /
         900=43%。98.css の Pixelated MS Sans Serif も 700 で 16%)。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>コミケットカタログブラウザ Web 移植版 (C96)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
